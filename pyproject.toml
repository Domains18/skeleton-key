[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skeleton-key"
version = "0.1.0"
description = "AirDrop-style environment replicator and cross-platform dotfile adapter for Linux and macOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
    "zeroconf>=0.130.0",
    "flask>=3.0.0",
]

[project.scripts]
skeleton-key = "skeleton_key.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skeleton_key*"]

[tool.pytest.ini_options]
pythonpath = ["."]
