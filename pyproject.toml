[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bootstrap"
version = "1.0.0"
description = "Cross-platform system bootstrapper tool for Mac and Linux"
dependencies = [
    "typer>=0.9.0",
]

[project.scripts]
setup-my-mac = "bootstrap.cli:app"
